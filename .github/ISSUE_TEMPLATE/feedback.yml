name: Installation or review-hint feedback
description: Report a setup obstacle, missing hint, or irrelevant hint using a minimal redacted example.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the beta. Findings are review hints, not runtime compatibility proof.
        Do not attach baselines, credentials, private configs or unredacted reports.
        For security issues, follow SECURITY.md instead of publishing sensitive evidence here.
  - type: input
    id: versions
    attributes:
      label: Package, Python and Git versions; operating system
      placeholder: "For example: package 0.1.0, Python 3.11, Git 2.x, macOS"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Explain the first step you could not complete or the one skill line you expected to review.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal redacted example
      description: Include the command, before/after commit IDs if relevant, and only the necessary non-sensitive skill excerpt.
      render: text
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include the reported status or warning. Was the hint useful, irrelevant, or missing?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Sharing boundary
      options:
        - label: I removed credentials, private configurations and private paths, and did not attach a baseline.
          required: true
