name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested release tag
        required: true
        default: v0.1.0
permissions: {}
concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q && ruff check . && ruff format --check .
      - run: python -m build && python -m twine check dist/*
      - run: python scripts/check_publication.py && python scripts/verify_wheel.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  publish:
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-skill-drift
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
