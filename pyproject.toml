[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-skill-drift"
version = "0.1.0"
description = "Read-only Git-version evidence for reviewing Hermes skills after updates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Maurice Mohr"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/mauricemohr88-debug/hermes-skill-drift"
Issues = "https://github.com/mauricemohr88-debug/hermes-skill-drift/issues"
Changelog = "https://github.com/mauricemohr88-debug/hermes-skill-drift/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "build>=1.2,<2", "twine>=6,<8"]

[project.scripts]
hermes-skill-drift = "hermes_skill_drift.cli:main"

[project.entry-points."hermes_agent.plugins"]
skill-drift = "hermes_skill_drift.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_skill_drift"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**", "tests/**", "examples/**", "scripts/**", "docs/TRY_IT.md", "docs/VALIDATION.md",
  "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "pyproject.toml", ".github/workflows/ci.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
