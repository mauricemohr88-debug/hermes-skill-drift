<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Hermes Skill Drift Check: which parts of my own skills deserve another look after a Hermes update?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0820"/>
      <stop offset="0.55" stop-color="#1b1240"/>
      <stop offset="1" stop-color="#0f3a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.42">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3eeff"/>
      <stop offset="1" stop-color="#b9f5ea"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <!-- drift lines in the background -->
    <g fill="none" stroke="#a78bfa" stroke-opacity="0.08" stroke-width="2">
      <path d="M0 300 C200 270, 380 320, 640 290 S1050 250, 1280 280"/>
      <path d="M0 322 C240 300, 420 340, 680 312 S1080 280, 1280 305"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="64" y="110" font-size="58" font-weight="800" fill="url(#title)">Hermes Skill Drift Check</text>
      <text x="66" y="164" font-size="27" font-weight="600" fill="#e4dcff">Which parts of my own skills deserve</text>
      <text x="66" y="200" font-size="27" font-weight="600" fill="#e4dcff">another look after a Hermes update?</text>
    </g>
    <text x="66" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9fe6da">read-only · local · no model calls · evidence for human review</text>

    <!-- two Hermes versions drifting apart -->
    <g transform="translate(800 0)">
      <path d="M0 170 H90" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <path d="M90 170 C130 170, 140 110, 200 106" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <path d="M90 170 C130 170, 140 232, 200 236" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
      <circle cx="20" cy="170" r="9" fill="#1b1240" stroke="#a78bfa" stroke-width="4"/>
      <circle cx="90" cy="170" r="9" fill="#1b1240" stroke="#a78bfa" stroke-width="4"/>
      <circle cx="200" cy="106" r="11" fill="#a78bfa"/>
      <circle cx="200" cy="236" r="11" fill="#5eead4"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
        <text x="200" y="80" text-anchor="middle" fill="#c4b5fd">before</text>
        <text x="200" y="270" text-anchor="middle" fill="#99f6e4">after</text>
      </g>
    </g>

    <!-- a skill file with the passage that needs review -->
    <g transform="translate(1036 98)">
      <rect width="200" height="146" rx="12" fill="#140d30" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2"/>
      <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c4b5fd">SKILL.md</text>
      <g stroke="#3b2f6b" stroke-width="6" stroke-linecap="round">
        <path d="M16 48 H150 M16 98 H170 M16 120 H120"/>
      </g>
      <rect x="10" y="62" width="180" height="24" rx="6" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-width="1.5"/>
      <text x="18" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#99f6e4">--legacy · removed</text>
    </g>
  </g>
</svg>
